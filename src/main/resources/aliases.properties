# CommandAlias (proxy/Velocity) config
#
# Format: alias=target
#   /s runs /server, etc. Anything typed after the alias is passed through,
#   e.g. "/s lobby" runs "/server lobby".
#
# This file is separate from the Paper-side config.yml - this one only
# aliases commands that live on the Velocity proxy (server, send, glist,
# and similar), not backend Paper commands like ahouse or lp.
#
# Restart the proxy after editing (no /commandalias reload equivalent yet
# on the proxy side).

s=server
#hub=server lobby
